name: Hub jobs

# Fired by Airtable automations (repository_dispatch):
#   build-post     - "Self-serve post: draft it" (record = LinkedIn Posts Personal row)
#   index-library  - "Library: refresh the question bar" (no record needed)
#   revise-copy    - "Author notes: revise the text" (record = post or article row, table = post|article)
#   make-image     - "Post image: draw it" (record = LinkedIn Posts Personal row; no record = every upcoming post without one)
#   library-previews - flip-through previews and guides for Resource Library items (also runs after index-library,
#                    and on any push that changes library_previews.py)
# or by hand from the Actions tab.
on:
  repository_dispatch:
    types: [build-post, index-library, meeting-overviews, voice-cards, revise-copy, make-image, library-previews]
  push:
    branches: [main]
    paths: [library_previews.py]
  schedule:
    - cron: "17 12 * * 1"   # Mondays: rebuild the My voice cards
    - cron: "41 11 * * *"   # daily: meeting overviews and the team conversations the question bar reads
  workflow_dispatch:
    inputs:
      mode:
        description: "build-post, index-library, meeting-overviews, voice-cards, revise-copy, make-image or library-previews"
        required: true
        default: index-library
      record_id:
        description: "Record ID (build-post, revise-copy, make-image)"
        required: false
      table:
        description: "post or article (revise-copy only)"
        required: false

concurrency:
  group: hub-${{ github.event.action || github.event.inputs.mode || github.event.schedule }}-${{ github.event.client_payload.record_id || github.event.inputs.record_id || 'all' }}

jobs:
  run:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      MODE: ${{ github.event_name == 'push' && 'library-previews' || github.event.action || github.event.inputs.mode || (github.event.schedule == '41 11 * * *' && 'meeting-overviews' || 'voice-cards') }}
      RECORD_ID: ${{ github.event.client_payload.record_id || github.event.inputs.record_id }}
      TABLE: ${{ github.event.client_payload.table || github.event.inputs.table }}
    steps:
      - uses: actions/checkout@v4

      - name: Fonts for the post image
        if: env.MODE == 'build-post' || env.MODE == 'make-image' || env.MODE == 'meeting-overviews'
        run: |
          sudo apt-get install -y -qq --no-install-recommends fonts-crosextra-carlito fonts-dejavu-core > /dev/null || (sudo apt-get update -qq && sudo apt-get install -y -qq --no-install-recommends fonts-crosextra-carlito fonts-dejavu-core > /dev/null)
          fc-cache -f > /dev/null

      - name: LibreOffice for the library previews
        if: env.MODE == 'index-library' || env.MODE == 'library-previews'
        timeout-minutes: 7
        run: |
          for i in 1 2 3; do sudo timeout 120 apt-get update -qq -o Acquire::Retries=3 && break; sleep 5; done
          sudo apt-get install -y -qq --no-install-recommends -o Acquire::Retries=3 libreoffice-impress libreoffice-writer poppler-utils fonts-inter fonts-crosextra-carlito > /dev/null
          mkdir -p ~/.config/fontconfig
          cp fonts.conf ~/.config/fontconfig/fonts.conf
          fc-cache -f > /dev/null

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Python packages
        run: pip install -q python-pptx==1.0.2 python-docx==1.2.0 pillow cairosvg==2.9.1 pypdf==5.9.0

      - name: Run
        env:
          AIRTABLE_TOKEN: ${{ secrets.AIRTABLE_TOKEN }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: python hub_jobs.py
