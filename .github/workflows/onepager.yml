name: Build one-pager version

# Fired by Airtable automations (repository_dispatch):
#   onepager-build - "One-pager: build new version" (record = One-pager Versions row, Status = Building)
#   onepager-send  - "One-pager: prepare send" (record = One-pager Sends row, Status = Preparing): renders the
#                    current words with the contacts the sender picked and attaches the PDF
# or by hand from the Actions tab.
on:
  repository_dispatch:
    types: [onepager-build, onepager-send]
  workflow_dispatch:
    inputs:
      record_id:
        description: "Record ID (rec...)"
        required: true
      mode:
        description: "onepager-build or onepager-send"
        required: false
        default: onepager-build

# One version at a time, so two edits never both become Current. Sends run side by side.
concurrency:
  group: ${{ (github.event.action || github.event.inputs.mode) == 'onepager-send' && format('onepager-send-{0}', github.event.client_payload.record_id || github.event.inputs.record_id) || 'onepager' }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      RECORD_ID: ${{ github.event.client_payload.record_id || github.event.inputs.record_id }}
      MODE: ${{ github.event.action || github.event.inputs.mode || 'onepager-build' }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Playwright (uses the runner's Google Chrome)
        run: |
          pip install -q playwright==1.48.0
          if [ ! -x /usr/bin/google-chrome ]; then python -m playwright install --with-deps chromium; fi

      - name: Build the version
        env:
          AIRTABLE_TOKEN: ${{ secrets.AIRTABLE_TOKEN }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: python onepager/onepager.py
