<!doctype html>
<html lang="en">
<head>

<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">

<title>Review your deck</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{--violet:#1F1534;--indigo:#0D09B5;--blue:#0075E4;--green:#0BD7A1;--bg:#F6F0EB;--card:#fff;--ink:#1F1534;--muted:#6B6478;--line:#E4DDD6;--soft:#FBF8F5;
--ok:#0F8F6A;--okbg:#DDF7EE;--warn:#9A5B00;--warnbg:#FDF1D8;--bad:#B42318;--badbg:#FDE8E7;--chg:#E7E7F3}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#17102A;--card:#231A3B;--ink:#F3EEF8;--muted:#B5ACC4;--line:#3A3052;--soft:#2A2046;--okbg:#0F3B30;--ok:#7BE8C6;--warnbg:#45330C;--warn:#F5C66B;--badbg:#4A1A1A;--bad:#FF9C93;--chg:#2E2A5A}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.5 Inter,system-ui,-apple-system,"Segoe UI",sans-serif;padding-bottom:40px}
a{color:var(--blue)}
header{background:var(--violet);color:#fff;padding:14px 16px}
.wrap{max-width:1180px;margin:0 auto}
.top{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap}
.logo{height:22px;width:auto;display:block}
.links{display:flex;gap:14px;font-size:13px}
.links a{color:rgba(255,255,255,.8);text-decoration:none}
.links a:hover{color:#fff}
.headline{margin-top:12px}
h1{font-size:22px;margin:0;letter-spacing:-.01em}
.who{font-size:13px;color:rgba(255,255,255,.75);margin-top:2px}
main{padding:16px}
.bar{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px 16px;display:flex;flex-wrap:wrap;gap:12px 20px;align-items:center;justify-content:space-between;margin-bottom:12px;position:sticky;top:8px;z-index:4}
@media(max-width:700px){.bar{position:static}}
.bar .count{font-weight:600}
.bar .sub{font-size:13px;color:var(--muted)}
.prog{height:8px;background:var(--soft);border-radius:99px;overflow:hidden;margin-top:6px;width:min(320px,70vw)}
.prog i{display:block;height:8px;background:var(--blue);border-radius:99px;width:0}
.btn{font:inherit;font-weight:600;font-size:14.5px;border:1px solid var(--line);border-radius:999px;padding:10px 18px;background:var(--card);color:var(--ink);cursor:pointer;min-height:44px;text-decoration:none;display:inline-flex;align-items:center;justify-content:center;gap:8px}
.btn.primary{background:var(--blue);border-color:var(--blue);color:#fff}
.btn.dark{background:var(--ink);border-color:var(--ink);color:var(--card)}
.btn:disabled{opacity:.5;cursor:not-allowed}
.btn.link{border:0;background:none;color:var(--blue);padding:8px 4px;text-decoration:underline;min-height:0}
.tools{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin:0 0 14px;font-size:13px;color:var(--muted)}
.pill{background:var(--card);border-radius:99px;padding:7px 12px}
.slide{background:var(--card);border:2px solid var(--card);border-radius:18px;padding:18px;display:flex;flex-wrap:wrap;gap:22px;margin-bottom:14px}
.slide.need{border-color:#FB923F}
.thumb{flex:0 1 440px;min-width:240px}
.thumb img{width:100%;display:block;border-radius:10px;border:1px solid var(--line);background:var(--soft);aspect-ratio:16/9;object-fit:contain}
.thumb .noimg{aspect-ratio:16/9;border-radius:10px;border:1px dashed var(--line);display:grid;place-items:center;color:var(--muted);font-size:13px;text-align:center;padding:12px}
.thumb .cap{font-size:12px;color:var(--muted);margin-top:6px}
.body{flex:999 1 420px;min-width:0;display:flex;flex-direction:column;gap:12px}
.hd{display:flex;flex-wrap:wrap;align-items:center;gap:6px 12px}
.num{font-size:12px;font-weight:600;letter-spacing:.08em;color:var(--muted)}
.hd h2{margin:0;font-size:18px;flex:1;min-width:180px;line-height:1.25}
.badge{font-size:12.5px;font-weight:600;padding:5px 11px;border-radius:99px;background:var(--soft)}
.badge.good{background:var(--okbg);color:var(--ok)}
.badge.work{background:var(--warnbg);color:var(--warn)}
.badge.chg{background:var(--chg)}
details.txt{background:var(--soft);border-radius:12px;padding:10px 14px}
details.txt summary{cursor:pointer;font-size:13px;color:var(--muted)}
.lines{font-size:14px;line-height:1.45;margin-top:6px}
.lines p{margin:0 0 6px}
.lines p.new{background:var(--chg);border-radius:6px;padding:2px 6px}
.acts{display:flex;flex-wrap:wrap;gap:8px}
.btn.on{background:var(--ink);border-color:var(--ink);color:var(--card)}
.panel{border:1px solid var(--line);border-radius:14px;padding:14px;display:flex;flex-direction:column;gap:10px}
.panel label.l{font-weight:600;font-size:14px}
textarea{width:100%;font:inherit;font-size:14.5px;line-height:1.5;color:var(--ink);background:var(--card);border:1px solid var(--line);border-radius:10px;padding:10px 12px;resize:vertical}
.chk{display:flex;gap:10px;align-items:flex-start;font-size:13.5px;line-height:1.4}
.chk input{width:18px;height:18px;margin:2px 0 0;accent-color:var(--indigo)}
.hint{font-size:12.5px;color:var(--muted)}
.inl{background:var(--soft);border-radius:12px;padding:12px 14px;display:flex;flex-direction:column;gap:8px}
.inl label{font-size:12px;color:var(--muted);font-weight:600}
.inl textarea{font:inherit;font-size:14px;line-height:1.45;border:1px solid var(--line);border-radius:10px;padding:8px 10px;width:100%;box-sizing:border-box;background:var(--card);color:var(--ink);resize:vertical}
.made{font-size:12px;color:var(--muted);margin-top:6px;line-height:1.5}
.made b{color:var(--ink);font-weight:600}
.rw{display:flex;flex-wrap:wrap;gap:8px;margin-top:10px}
.rw .btn{font-size:13px;padding:7px 13px;min-height:36px}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chips button{font:inherit;font-size:13px;border:1px solid var(--line);background:var(--card);color:var(--ink);border-radius:99px;padding:6px 12px;cursor:pointer}
.chips button.on{background:var(--ink);border-color:var(--ink);color:var(--card)}
.badge.rw{background:#E8E4FB;color:#2B2754}
.row2{display:flex;gap:10px;flex-wrap:wrap}.row2>div{flex:1 1 160px}
.panel select,.panel input[type=text]{font:inherit;font-size:14px;border:1px solid var(--line);border-radius:10px;padding:8px 10px;width:100%;box-sizing:border-box;background:var(--card);color:var(--ink)}
.cmp{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:10px}
.cmp>div{border-radius:10px;padding:10px 12px;font-size:14px;line-height:1.45}
.cmp .b{background:var(--soft)}
.cmp .a{background:var(--chg)}
.cmp h4{margin:0 0 4px;font-size:11.5px;letter-spacing:.1em;color:var(--muted)}
.cmp p{margin:0 0 6px}
.ed label{display:block;font-size:12px;color:var(--muted);margin:8px 0 2px}
.msg{padding:12px 14px;border-radius:10px;margin:0 0 12px;font-size:14px}
.msg.err{background:var(--badbg);color:var(--bad)}.msg.ok{background:var(--okbg);color:var(--ok)}.msg.info{background:var(--card);border:1px solid var(--line)}
.center{background:var(--card);border-radius:18px;padding:28px;max-width:760px;margin:10px auto}
.center h2{margin:0 0 6px;font-size:22px}
.dl{display:flex;flex-wrap:wrap;gap:10px;margin:16px 0}
.sum{white-space:pre-wrap;background:var(--soft);border-radius:12px;padding:12px 14px;font-size:14px}
.vers{font-size:14px;margin-top:14px}
.vers li{margin:4px 0}
.spin{display:inline-block;width:14px;height:14px;border:2px solid var(--line);border-top-color:var(--blue);border-radius:50%;animation:s 1s linear infinite;vertical-align:-2px}
@keyframes s{to{transform:rotate(360deg)}}
.saved{font-size:12.5px;color:var(--muted)}
.loading{color:var(--muted);padding:40px 0;text-align:center}
.hidden{display:none!important}
button:focus-visible,a:focus-visible,textarea:focus-visible,input:focus-visible,summary:focus-visible{outline:2px solid var(--indigo);outline-offset:2px}
.thumb img{cursor:zoom-in;transition:box-shadow .15s}
.thumb img:hover{box-shadow:0 4px 18px rgba(31,21,52,.18)}
.lb{position:fixed;inset:0;z-index:1000;background:rgba(18,12,32,.97);display:none;flex-direction:column;align-items:center;justify-content:center;touch-action:pan-y;user-select:none}
.lb.on{display:flex}
.lb .stage{position:relative;width:min(calc(100vw - 150px),calc((100vh - 170px)*16/9));margin-top:30px;display:flex;align-items:center;justify-content:center}
.lb .stage img{width:100%;height:auto;max-height:calc(100vh - 170px);object-fit:contain;border-radius:8px;background:#fff;box-shadow:0 10px 40px rgba(0,0,0,.45)}
.lb .nav{position:fixed;top:50%;transform:translateY(-50%);width:52px;height:52px;border-radius:50%;border:0;background:rgba(255,255,255,.14);color:#fff;font-size:26px;cursor:pointer;display:grid;place-items:center}
.lb .nav:hover{background:rgba(255,255,255,.28)}
.lb .nav:disabled{opacity:.25;cursor:default}
.lb .prev{left:14px}.lb .next{right:14px}
.lb .x{position:fixed;top:12px;right:14px;width:44px;height:44px;border-radius:50%;border:0;background:rgba(255,255,255,.14);color:#fff;font-size:22px;cursor:pointer}
.lb .x:hover{background:rgba(255,255,255,.28)}
.lb .meta{color:#fff;margin-top:14px;font-size:14px;text-align:center;max-width:90vw}
.lb .meta b{font-weight:600}.lb .meta small{display:block;opacity:.65;font-size:12px;margin-top:3px}
.lb .lbacts{display:flex;gap:10px;margin-top:10px;flex-wrap:wrap;justify-content:center}
.lb .ok{font:inherit;font-size:14px;font-weight:600;color:#1F1534;background:#0BD7A1;border:0;border-radius:99px;padding:9px 18px;cursor:pointer;min-height:40px}
.lb .ok.done{background:rgba(11,215,161,.18);color:#0BD7A1;box-shadow:inset 0 0 0 1px #0BD7A1}
.lb .st{display:inline-block;margin-left:10px;font-size:12px;padding:2px 9px;border-radius:99px;background:rgba(255,255,255,.14)}
.lb .go{font:inherit;font-size:13px;font-weight:600;color:#fff;background:none;border:1px solid rgba(255,255,255,.4);border-radius:99px;padding:7px 14px;cursor:pointer}
@media (max-width:640px){.lb .stage{width:94vw}.lb .nav{top:auto;bottom:16px;transform:none}.lb .meta{margin-bottom:60px}}
</style>
</head>

function load(k){try{return localStorage.getItem(k)}catch(e){return null}}

  if(!token){fail("auth");return;}
  if(!/^rec[A-Za-z0-9]{14}$/.test(DECK)){fail("link");return;}
  try{
    const j=await callJSON({a:"deckget",id:DECK});

function fail(why){

  if(why==="link"){flash("This link is missing the deck. Open it from your deck email or from Decks on the hub.","err");return;}
  if(why==="notyours"){flash("This deck was requested by someone else, so only they can review it. Ask them to share it, or request your own from the hub.","err");return;}

function head(){

function render(){

  if(s==="Finalizing"&&ST.mode==="rework")return drawWaiting("Rebuilding the slides you asked for","New designs and new research go into the deck now. It comes back here for you to look at in about five minutes. This page refreshes on its own.",true);

  if(s==="Ready"&&!F[K.ready])return drawWaiting("Getting your slides ready to review","Almost there. This page refreshes on its own.",true);

  row.appendChild(btn("primary","Keep",()=>{
    const after={};
    Object.keys(fields).forEach(k=>{const v=fields[k].value.split("\n").map(t=>t.trim());while(v.length&&!v[v.length-1])v.pop();
      const old=(s.boxes.find(b=>b.k===k)||{}).paras||[];if(JSON.stringify(v)!==JSON.stringify(old))after[k]=v;});
    if(!Object.keys(after).length){alert("Nothing on the slide changed. Edit the words, or mark the slide Looks good.");return;}
    x.after=after;x.kept=true;x.applied=true;if(pr.manual&&!x.note)x.note="Edited by hand";
    redraw(s.n);changed();}));
  row.appendChild(btn("","Undo",()=>{x.applied=false;delete x.proposal;redraw(s.n);changed();}));
  p.appendChild(row);
  return p;
}
async function submit(){
  const c=count();if(c.done!==c.n)return;
  const nch=TEXT.filter(s=>(ST.slides[s.n]||{}).kept).length;
  if(!confirm(nch?"Build the final deck with "+nch+" changed slide"+(nch>1?"s":"")+"? You'll get the files by email in about three minutes.":"Every slide looks good. Send the deck as final?"))return;
  clearTimeout(saveTimer);
  document.querySelectorAll(".bar .btn.primary").forEach(b=>{b.disabled=true;b.textContent="Submitting…";});
  ST.updated=new Date().toISOString();ST.by=ME;ST.submitted=ST.updated;
  try{await callJSON({a:"decksubmit",id:DECK,state:JSON.stringify(ST)});track("Submitted deck review");F[K.status]="Finalizing";window.scrollTo(0,0);render();}
  catch(e){flash("Couldn't submit just now. Your review is saved; try Submit again in a minute.","err");drawBar();}
}
start();
</script>
<div class="lb" id="lb" role="dialog" aria-modal="true" aria-label="Slide viewer">
 <button type="button" class="x" id="lbx" aria-label="Close">✕</button>
 <button type="button" class="nav prev" id="lbp" aria-label="Previous slide">‹</button>
 <div class="stage"><img id="lbi" alt=""></div>
 <button type="button" class="nav next" id="lbn" aria-label="Next slide">›</button>
 <div class="meta" id="lbm"></div>
 <div class="lbacts"><button type="button" class="ok" id="lbok">✓  Looks good</button><button type="button" class="go" id="lbg">Edit or comment</button></div>
</div>
<script>
(function(){
 let items=[],i=0,last=null;const lb=document.getElementById("lb"),im=document.getElementById("lbi");
 function build(){const prev=F[K.prev]||[];items=[];TEXT.forEach((s,j)=>{const p=prev[j];if(p)items.push({n:String(s.n),title:s.title||("Slide "+s.n),url:p.url,thumb:(p.thumbnails&&p.thumbnails.large&&p.thumbnails.large.url)||p.url});});}
 function show(){const it=items[i];if(!it)return;im.src=it.thumb;const full=new Image();full.onload=()=>{if(items[i]===it)im.src=it.url;};full.src=it.url;im.alt="Slide "+it.n+": "+it.title;
  document.getElementById("lbm").innerHTML="";const m=document.getElementById("lbm");const b=document.createElement("b");b.textContent="Slide "+it.n+"  ·  "+it.title;const sm=document.createElement("small");sm.textContent=(i+1)+" of "+items.length+"   ←  →  to move, Esc to close";m.append(b,sm);
  const x=slideState(it.n),ok=document.getElementById("lbok");
  const stt=x.status==="good"?"Looks good":x.kept?"Changed":x.status==="work"?"Needs work":x.status==="redesign"?"Redesign requested":x.status==="research"?"New research requested":x.reworked?"Rebuilt, take a look":"Not reviewed";
  const tag=document.createElement("span");tag.className="st";tag.textContent=stt;b.appendChild(tag);
  const can=F[K.status]==="In review";ok.style.display=can?"":"none";document.getElementById("lbg").style.display=can?"":"none";
  ok.classList.toggle("done",x.status==="good");ok.textContent=x.status==="good"?"✓  Accepted (click to undo)":"✓  Looks good";
  document.getElementById("lbp").disabled=i===0;document.getElementById("lbn").disabled=i===items.length-1;
  [i-1,i+1].forEach(k=>{if(items[k]){const pre=new Image();pre.src=items[k].url;}});}
 window.lbOpen=function(n){build();const k=items.findIndex(x=>x.n===n);if(k<0)return;i=k;last=document.activeElement;lb.classList.add("on");document.body.style.overflow="hidden";show();document.getElementById("lbx").focus();};
 function close(){lb.classList.remove("on");document.body.style.overflow="";if(last&&last.focus)last.focus();}
 function go(d){const k=i+d;if(k>=0&&k<items.length){i=k;show();}}
 document.getElementById("lbx").onclick=close;document.getElementById("lbp").onclick=()=>go(-1);document.getElementById("lbn").onclick=()=>go(1);
 document.getElementById("lbok").onclick=()=>{const it=items[i];if(!it)return;const x=slideState(it.n);
  if(x.status==="good"){delete x.status;}else{Object.assign(x,{status:"good",applied:false,kept:false});delete x.after;delete x.proposal;delete x.open;delete x.inline;delete x.redesign;delete x.research;}
  redraw(it.n);changed();
  if(x.status==="good"&&i<items.length-1)setTimeout(()=>go(1),350);else show();};
 document.getElementById("lbg").onclick=()=>{const n=items[i]&&items[i].n;close();const c=document.getElementById("slide-"+n);if(c)c.scrollIntoView({behavior:"smooth",block:"start"});};
 lb.addEventListener("click",e=>{if(e.target===lb||e.target.classList.contains("stage"))close();});
 document.addEventListener("keydown",e=>{if(!lb.classList.contains("on"))return;if(e.key==="Escape")close();else if(e.key==="ArrowLeft")go(-1);else if(e.key==="ArrowRight")go(1);else if(e.key==="Tab"){const f=[...lb.querySelectorAll("button:not(:disabled)")];const a=f.indexOf(document.activeElement);if(e.shiftKey&&a<=0){e.preventDefault();f[f.length-1].focus();}else if(!e.shiftKey&&a===f.length-1){e.preventDefault();f[0].focus();}}});
 let x0=null,y0=null;lb.addEventListener("touchstart",e=>{x0=e.touches[0].clientX;y0=e.touches[0].clientY;},{passive:true});
 lb.addEventListener("touchend",e=>{if(x0===null)return;const dx=e.changedTouches[0].clientX-x0,dy=e.changedTouches[0].clientY-y0;if(Math.abs(dx)>50&&Math.abs(dx)>Math.abs(dy))go(dx<0?1:-1);x0=null;},{passive:true});
})();
</script>
